[workspace]
resolver = "2"
members = [
    "crates/atelier-core",
    "crates/atelier-studio",
    "crates/atelier-mcp",
    "crates/atelier",
    "crates/atelier-lab",
]
# Normal root commands cover only what ships. The unpublished research crate
# remains available explicitly with `-p atelier-lab` or `--workspace`.
default-members = [
    "crates/atelier-core",
    "crates/atelier-studio",
    "crates/atelier-mcp",
    "crates/atelier",
]
# Shared package metadata — each crate inherits with `field.workspace = true`.
[workspace.package]
version = "1.8.0"
description = "The pixel-art studio agents can see — layered, animated, game-ready art from the CLI or over MCP."
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/marmikshah/atelier"
homepage = "https://marmikshah.github.io/atelier/"
# GitHub releases are the distribution channel for now. Opt in crate-by-crate
# only after the public Rust API and crates.io release order are documented.
publish = false
keywords = ["mcp", "pixel-art", "sprite", "gamedev", "animation"]
categories = ["command-line-utilities", "multimedia::images", "game-development"]

# Single source of truth for dependency versions across the workspace.
[workspace.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
png = "0.18" # direct: APNG animation encoder (already in the tree via image)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"
dirs = "5"
# Content-addressing for the lab's artifact store (small, pure-Rust).
sha2 = "0.10"

# Structured logging: the library crates emit `tracing` events; only the
# binary installs a subscriber (stderr, `ATELIER_LOG` filter).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# MCP server stack (stdio + streamable-HTTP transports).
rmcp = { version = "1.7", features = ["server", "macros", "transport-io", "transport-streamable-http-server", "schemars"] }
schemars = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "net", "process", "signal", "sync"] }
axum = "0.8"

# Internal crates — path for local builds, version for crates.io publish.
atelier-core = { version = "1.8.0", path = "crates/atelier-core" }
atelier-studio = { version = "1.8.0", path = "crates/atelier-studio" }
atelier-mcp = { version = "1.8.0", path = "crates/atelier-mcp" }

# The shipped binary: thin LTO + one codegen unit + stripped symbols (the
# Docker image already stripped by hand; the release workflow didn't).
# No `panic = "abort"` — the server recovers poisoned studio locks by design.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
