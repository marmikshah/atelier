[package]
name = "atelier"
version = "1.0.0"
edition = "2021"
description = "MCP-native headless pixel-art editor: layered/animated documents, drawing primitives, PNG/sheet/GIF export."
license = "MIT OR Apache-2.0"

[[bin]]
name = "atelier"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

# MCP server stack (stdio + streamable-HTTP transports).
rmcp = { version = "1.7", features = ["server", "macros", "transport-io", "transport-streamable-http-server", "schemars"] }
schemars = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "net", "process", "signal"] }
