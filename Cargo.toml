[workspace]
resolver = "3"
members = [
    "crates/atelier-core",
    "crates/atelier-studio",
    "crates/atelier-mcp",
    "crates/atelier",
]
# Shared package metadata — each crate inherits with `field.workspace = true`.
[workspace.package]
version = "0.1.0"
description = "Offline, headless pixel-art editor with CLI and MCP interfaces."
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/marmikshah/atelier"
homepage = "https://marmikshah.github.io/atelier/"
# Build from source; the workspace crates are not published.
publish = false

# Single source of truth for dependency versions across the workspace.
[workspace.dependencies]
base64 = "0.22.1"
crc32fast = "1.5.0"
image = { version = "0.25.10", default-features = false, features = ["png", "gif"] }
png = "0.18.1" # direct: APNG animation encoder (already in the tree via image)
write-fonts = { version = "0.53.0", features = ["read"] }
# Independent reader and rasterizer for font-export validation.
ttf-parser = "0.25.1"
ab_glyph = "0.2.32"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Coordinates independent CLI and daemon processes that share a document store.
fs4 = { version = "1.1.0", features = ["sync"] }
# Canonical UUIDv4 document ids. UUID is already present through the MCP stack;
# declaring it directly keeps identity parsing and generation standards-based.
uuid = { version = "1.24.0", features = ["v4"] }

# Structured logging: the library crates emit `tracing` events; only the
# binary installs a subscriber (stderr, `ATELIER_LOG` filter).
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# MCP server stack (stdio + streamable-HTTP transports).
rmcp = { version = "2.2.0", features = ["server", "macros", "transport-io", "transport-streamable-http-server", "schemars"] }
schemars = "1.2.1"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "net", "process", "signal", "sync"] }
axum = "0.8.9"

# Internal crates build from local paths.
atelier-core = { path = "crates/atelier-core" }
atelier-studio = { path = "crates/atelier-studio" }
atelier-mcp = { path = "crates/atelier-mcp" }

# Native and container release binaries share optimization and symbol stripping.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
