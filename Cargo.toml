[workspace]
resolver = "2"
members = [
    "crates/atelier-core",
    "crates/atelier-studio",
    "crates/atelier-mcp",
    "crates/atelier",
]

# Shared package metadata — each crate inherits with `field.workspace = true`.
[workspace.package]
version = "1.3.0"
description = "The pixel-art studio agents can see — layered, animated, game-ready art over MCP."
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/marmikshah/atelier"
keywords = ["mcp", "pixel-art", "sprite", "gamedev", "animation"]
categories = ["command-line-utilities", "multimedia::images", "game-development"]

# Single source of truth for dependency versions across the workspace.
[workspace.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
png = "0.18" # direct: APNG animation encoder (already in the tree via image)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

# MCP server stack (stdio + streamable-HTTP transports).
rmcp = { version = "1.7", features = ["server", "macros", "transport-io", "transport-streamable-http-server", "schemars"] }
schemars = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "net", "process", "signal", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = "0.8"

# Internal crates — path for local builds, version for crates.io publish.
atelier-core = { version = "1.3.0", path = "crates/atelier-core" }
atelier-studio = { version = "1.3.0", path = "crates/atelier-studio" }
atelier-mcp = { version = "1.3.0", path = "crates/atelier-mcp" }
