[package]
name = "atelier"
description = "The pixel-art studio agents can see — a headless editor driven from the CLI or over MCP: layered/animated documents, drawing primitives, PNG/sheet/GIF export."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "atelier"
path = "src/main.rs"

[dependencies]
atelier-mcp.workspace = true
atelier-studio.workspace = true
base64.workspace = true
# The binary handles rmcp result/tool types from atelier-mcp's dispatch and
# registry (call/replay); the crate is already in the tree via atelier-mcp.
rmcp.workspace = true
tokio.workspace = true
serde_json.workspace = true
tracing-subscriber.workspace = true
