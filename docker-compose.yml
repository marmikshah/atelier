# Persistent atelier HTTP MCP server. Point any MCP client at
#   http://127.0.0.1:8765/mcp
# Documents survive restarts in the named volume.
services:
  atelier:
    image: ghcr.io/marmikshah/atelier:latest
    # Or build locally instead of pulling:
    # build: .
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - atelier-data:/data
    environment:
      # core = the lean default set; full = the whole surface.
      ATELIER_PROFILE: full
      # Only needed to reach the server from another host/LAN:
      # ATELIER_ALLOWED_HOSTS: "atelier.local,10.0.0.5:8765"
    restart: unless-stopped

volumes:
  atelier-data:
