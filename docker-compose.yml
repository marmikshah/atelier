# Persistent atelier HTTP MCP server. Point any MCP client at
#   http://127.0.0.1:8765/mcp
# Documents survive restarts in the named volume.
# Set ATELIER_HTTP_TOKEN in the shell or a local ignored .env before starting.
services:
  atelier:
    image: ghcr.io/marmikshah/atelier:latest
    # Released images are published for linux/amd64 only, so that is the
    # default. When you build locally instead, set ATELIER_PLATFORM to your own
    # platform (linux/arm64 on Apple Silicon, Graviton, or a Pi 5) to get a
    # native image rather than an emulated one.
    platform: ${ATELIER_PLATFORM:-linux/amd64}
    # Or build locally instead of pulling:
    # build: .
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - atelier-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      ATELIER_HTTP_TOKEN: "${ATELIER_HTTP_TOKEN:?set ATELIER_HTTP_TOKEN before starting Atelier}"
    # Optional HTTP file access remains rooted and relative:
    #   ATELIER_IMPORT_ROOT: /imports
    #   ATELIER_EXPORT_ROOT: /exports
    # Add matching read-only/read-write bind mounts when enabling those roots.
    restart: unless-stopped

volumes:
  atelier-data:
