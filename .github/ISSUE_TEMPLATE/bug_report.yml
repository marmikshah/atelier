name: Bug report
description: Report reproducible incorrect behavior.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Include the smallest reproducible command or tool-call sequence you can provide.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, and what went wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands / tool calls. A recipe JSON or a minimal sequence is ideal.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: atelier version
      description: Output of `atelier --version` and the checkout commit.
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options:
        - CLI / replay
        - stdio
        - HTTP (foreground)
        - HTTP (background daemon)
        - Docker
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      description: For example, Claude Code, Cursor, Cline, or Gemini CLI.
  - type: input
    id: os
    attributes:
      label: Supported runtime
      description: e.g. Ubuntu 24.04 x86_64, macOS, or the Alpine linux/amd64 image.
