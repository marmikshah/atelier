name: Showcase

# The showcase claims every GIF is reproducible from the replay beside it.
# This proves it. It replays the complete matrix and requires byte-identical GIFs,
# on pull requests that change the editor or showcase, on master, and on demand.
on:
  push:
    branches: [master]
    paths:
      - "showcase/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "tools/showcase.py"
      - ".github/workflows/showcase.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "showcase/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "tools/showcase.py"
      - ".github/workflows/showcase.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: showcase-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replays:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Replay every showcase recipe
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.98.0

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Build the editor
        run: cargo build --locked -p atelier

      - name: Replay the showcase matrix
        run: python3 tools/showcase.py verify
