name: Rust checks

on:
  workflow_call:
    inputs:
      kind:
        description: Repository kind
        type: string
        required: true

permissions:
  contents: read

jobs:
  gate:
    name: gate
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: No local machine paths
        run: |
          if git grep -nI -E '/Users/|/private/(tmp|var)|[A-Za-z]:\\Users\\|/home/[a-z0-9_.-]+/Workspace' \
              -- . ':!*.lock' ':!.github/workflows/ci-rust.yml'; then
            echo "::error::Local machine path found in a tracked file."
            exit 1
          fi

      - name: Shell scripts
        run: shellcheck .githooks/pre-commit .githooks/pre-push tools/*.sh

      - name: GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: tools/check.sh
