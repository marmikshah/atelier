name: Docker

# Release tags reach this workflow after archive builds succeed and before the
# GitHub Release becomes public. workflow_dispatch can retry an existing tag.
on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing annotated release tag
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated release tag (for example v1.8.0)
        required: true
        type: string

concurrency:
  group: docker-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Validate the release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          tag_ref="refs/tags/${RELEASE_TAG}"
          [[ "$(git cat-file -t "$tag_ref" 2>/dev/null || true)" == "tag" ]] || {
            echo "::error::$RELEASE_TAG must be an existing annotated or signed tag"
            exit 1
          }
          tools/release-check.sh "$RELEASE_TAG"

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.release_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.release_tag }}
            type=raw,value=${{ inputs.release_tag }}
            type=raw,value=latest

      # Smoke first: a release tag must never publish an image that does not boot.
      - name: Build (amd64, loaded for the smoke test)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ghcr.io/${{ github.repository }}:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — the image boots and answers MCP initialize
        shell: bash
        run: |
          docker run -d --name smoke -p 127.0.0.1:18765:8765 ghcr.io/${{ github.repository }}:smoke
          code=000
          attempts=0
          while [ "$attempts" -lt 30 ]; do
            attempts=$((attempts + 1))
            code=$(curl -s -o /tmp/mcp.json -w '%{http_code}' -X POST http://127.0.0.1:18765/mcp \
              -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}' || echo 000)
            [ "$code" = "200" ] && break
            sleep 1
          done
          docker logs smoke
          docker rm -f smoke
          [ "$code" = "200" ] || { echo "smoke: no HTTP 200 from /mcp (got $code)"; exit 1; }
          grep -q '"serverInfo"' /tmp/mcp.json || { echo "smoke: no serverInfo in initialize reply"; cat /tmp/mcp.json; exit 1; }
          echo "smoke: image answered MCP initialize with serverInfo"

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
