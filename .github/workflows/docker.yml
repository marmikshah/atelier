name: Alpine image

# Release tags reach this workflow after archive builds succeed and before the
# GitHub Release becomes public. Docker deliberately ships only linux/amd64:
# one native build, one smoke test, then a push of that exact image.
on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing annotated release tag
        required: true
        type: string
      publish:
        description: Push the validated image to GHCR
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated release tag (for example v1.8.0)
        required: true
        type: string
      publish:
        description: Push the validated image to GHCR
        required: true
        default: false
        type: boolean

concurrency:
  group: docker-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  image:
    name: Alpine linux/amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Validate the release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          tag_ref="refs/tags/${RELEASE_TAG}"
          [[ "$(git cat-file -t "$tag_ref" 2>/dev/null || true)" == "tag" ]] || {
            echo "::error::$RELEASE_TAG must be an existing annotated or signed tag"
            exit 1
          }
          tools/release-check.sh "$RELEASE_TAG"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.release_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.release_tag }}
            type=raw,value=${{ inputs.release_tag }}
            type=raw,value=latest

      - name: Build linux/amd64 image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test authenticated MCP persistence
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ inputs.release_tag }}
        run: |
          test "$(docker image inspect --format '{{.Architecture}}' "$IMAGE")" = "amd64"
          docker run --rm "$IMAGE" --version
          tools/container-smoke.sh "$IMAGE"

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the smoke-tested image
        if: inputs.publish
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          printf '%s\n' "$IMAGE_TAGS" |
            while IFS= read -r tag; do
              [ -z "$tag" ] || docker push "$tag"
            done
