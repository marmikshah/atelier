name: Docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  image:
    runs-on: ubuntu-latest
    # GITHUB_TOKEN needs write to publish the image to GHCR.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      # Smoke first: a release tag must never publish an image that doesn't boot.
      - name: Build (amd64, loaded for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ghcr.io/${{ github.repository }}:smoke
          cache-from: type=gha

      - name: Smoke test — the image boots and answers MCP initialize
        run: |
          docker run -d --name smoke -p 127.0.0.1:18765:8765 ghcr.io/${{ github.repository }}:smoke
          code=000
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/mcp.json -w '%{http_code}' -X POST http://127.0.0.1:18765/mcp \
              -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}' || echo 000)
            [ "$code" = "200" ] && break
            sleep 1
          done
          docker logs smoke
          docker rm -f smoke
          [ "$code" = "200" ] || { echo "smoke: no HTTP 200 from /mcp (got $code)"; exit 1; }
          grep -q '"serverInfo"' /tmp/mcp.json || { echo "smoke: no serverInfo in initialize reply"; cat /tmp/mcp.json; exit 1; }
          echo "smoke: image answered MCP initialize with serverInfo"

      - name: Build & push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
