name: Release

# A maintainer-created annotated tag is the release approval. The verify job
# must pass before any platform build starts, and GitHub Release creation waits
# for every archive, checksum, and container so failures cannot publish a
# user-facing partial release.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Require a manual annotated tag on master
        shell: bash
        run: |
          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          if [[ "$(git cat-file -t "$tag_ref" 2>/dev/null || true)" != "tag" ]]; then
            echo "::error::$GITHUB_REF_NAME must be an annotated or signed tag"
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "$tag_ref")"
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$tag_commit" origin/master; then
            echo "::error::$GITHUB_REF_NAME does not point to a commit on origin/master"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Match tag, packages, lockfile, and changelog
        run: tools/release-check.sh "$GITHUB_REF_NAME"
      - name: Production gate
        run: make check
      - name: Match the binary version
        shell: bash
        run: |
          expected="atelier ${GITHUB_REF_NAME#v}"
          actual="$(target/debug/atelier --version)"
          [[ "$actual" == "$expected" ]] || {
            echo "::error::binary reports '$actual', expected '$expected'"
            exit 1
          }

  build:
    needs: verify
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # One macOS build: Apple Silicon on the latest runner. Intel users
          # build from source (`cargo install --locked --git
          # https://github.com/marmikshah/atelier --package atelier`).
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # Name and lock the release package explicitly.
      - run: cargo build --release --locked -p atelier --target ${{ matrix.target }}

      - name: Archive and checksum (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive="atelier-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C "target/${{ matrix.target }}/release" atelier
          shasum -a 256 "$archive" > "$archive.sha256"

      - name: Archive and checksum (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "atelier-${env:GITHUB_REF_NAME}-${{ matrix.target }}.zip"
          Compress-Archive `
            -Path "target/${{ matrix.target }}/release/atelier.exe" `
            -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -Encoding ascii "$archive.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: atelier-${{ github.ref_name }}-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 1

  docker:
    needs: build
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets: inherit

  publish_release:
    needs: [build, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify the complete artifact set
        shell: bash
        run: |
          [[ "$(find dist -maxdepth 1 -type f | wc -l)" -eq 6 ]] || {
            echo "::error::expected three archives and three checksums"
            find dist -maxdepth 1 -type f -print
            exit 1
          }
          cd dist
          sha256sum -c -- *.sha256
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
