name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    # action-gh-release creates the GitHub Release; the default GITHUB_TOKEN is
    # read-only, so grant write access to repository contents (releases).
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # One macOS build: Apple Silicon on the latest runner. Intel users
          # build from source (cargo install --git https://github.com/marmikshah/atelier).
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}

      - name: Archive (unix)
        if: runner.os != 'Windows'
        run: tar -czf atelier-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release atelier
      - name: Archive (windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/${{ matrix.target }}/release/atelier.exe -DestinationPath atelier-${{ github.ref_name }}-${{ matrix.target }}.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: atelier-${{ github.ref_name }}-${{ matrix.target }}.*
