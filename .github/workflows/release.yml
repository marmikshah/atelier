name: Release

# A maintainer-created annotated tag is the release approval. The verify job
# must pass before the Ubuntu build starts, and GitHub Release creation waits
# for its archive, checksum, and the Alpine container so failures cannot publish a
# user-facing partial release.
run-name: Release ${{ inputs.release_tag || github.ref_name }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated release tag to retry
        required: true
        type: string

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Require a manual annotated tag on master
        shell: bash
        run: |
          tag_ref="refs/tags/${RELEASE_TAG}"
          if [[ "$(git cat-file -t "$tag_ref" 2>/dev/null || true)" != "tag" ]]; then
            echo "::error::$RELEASE_TAG must be an annotated or signed tag"
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "$tag_ref")"
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$tag_commit" origin/master; then
            echo "::error::$RELEASE_TAG does not point to a commit on origin/master"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Match tag, packages, lockfile, and changelog
        run: tools/release-check.sh "$RELEASE_TAG"
      - name: Production gate
        run: make check
      - name: Match the binary version
        shell: bash
        run: |
          expected="atelier ${RELEASE_TAG#v}"
          actual="$(target/debug/atelier --version)"
          [[ "$actual" == "$expected" ]] || {
            echo "::error::binary reports '$actual', expected '$expected'"
            exit 1
          }

  native:
    name: Ubuntu 22.04+ x86_64 archive
    needs: verify
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1

      # Name and lock the release package explicitly.
      - run: cargo build --release --locked -p atelier

      - name: Package binary, documentation, and license
        shell: bash
        run: |
          package="atelier-${RELEASE_TAG}-ubuntu-x86_64"
          archive="$package.tar.gz"
          mkdir -p "dist/$package"
          install -m 755 target/release/atelier "dist/$package/atelier"
          install -m 644 LICENSE README.md "dist/$package/"
          tar -czf "$archive" -C dist "$package"
          sha256sum "$archive" > "$archive.sha256"

      - name: Smoke test the packaged artifact
        shell: bash
        run: |
          package="atelier-${RELEASE_TAG}-ubuntu-x86_64"
          archive="$package.tar.gz"
          expected="atelier ${RELEASE_TAG#v}"
          smoke="$(mktemp -d)"
          trap 'rm -rf "$smoke"' EXIT
          sha256sum -c "$archive.sha256"
          tar -xzf "$archive" -C "$smoke"
          test -x "$smoke/$package/atelier"
          test -f "$smoke/$package/LICENSE"
          test -f "$smoke/$package/README.md"
          test "$("$smoke/$package/atelier" --version)" = "$expected"
          "$smoke/$package/atelier" tools --schema doc_new >/dev/null
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"package-smoke","version":"0"}}}' |
            ATELIER_HOME="$smoke/home" ATELIER_LOG=off timeout 10 \
              "$smoke/$package/atelier" >"$smoke/initialize.json"
          grep -q '"serverInfo":{"name":"atelier"' "$smoke/initialize.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-ubuntu-x86_64
          path: atelier-${{ env.RELEASE_TAG }}-ubuntu-x86_64.tar.gz*
          if-no-files-found: error
          retention-days: 1

  docker:
    needs: native
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      release_tag: ${{ inputs.release_tag || github.ref_name }}
    secrets: inherit

  publish_release:
    needs: [native, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify the complete artifact set
        shell: bash
        run: |
          [[ "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2 ]] || {
            echo "::error::expected one Ubuntu archive and one checksum"
            find dist -maxdepth 1 -type f -print
            exit 1
          }
          cd dist
          sha256sum -c -- *.sha256
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
