name: Image

# A version tag publishes the container image and its MCP Registry entry.
# Nothing here runs on branches or pull requests.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: Publish the container image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches Cargo.toml and server.json
        env:
          TAG: ${{ github.ref_name }}
        run: tools/check-version.sh "${TAG#v}"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build the linux/amd64 image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: atelier:release
          cache-from: type=gha
      - name: Smoke test before publishing
        run: tools/container-smoke.sh atelier:release
      - name: Push the version and latest tags
        env:
          TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in "${TAG#v}" latest; do
            docker tag atelier:release "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done

  registry:
    name: Publish the MCP Registry entry
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" |
            tar xz mcp-publisher
      - name: Publish server.json
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
